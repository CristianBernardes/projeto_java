services:
  postgres:
    container_name: projeto-java-postgres
    image: postgres:14.24-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: java
      POSTGRES_PASSWORD: java
      POSTGRES_DB: java
    volumes:
      - ./.docker/postgres/dbdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - projeto-java
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U java -d java"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: projeto-java-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/java
      SPRING_DATASOURCE_USERNAME: java
      SPRING_DATASOURCE_PASSWORD: java
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8088:8080"
    volumes:
      - uploads_data:/app/.docker/uploads
    networks:
      - projeto-java
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  rabbitmq:
    container_name: projeto-java-rabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: java
      RABBITMQ_DEFAULT_PASS: java
    volumes:
      - ./.docker/rabbitmq/data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - projeto-java
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    container_name: projeto-java-kafka
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./.docker/kafka/data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - projeto-java
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  maven:
    container_name: projeto-java-maven
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - maven-cache:/root/.m2
    networks:
      - projeto-java
    profiles:
      - dev

networks:
  projeto-java:
    driver: bridge

volumes:
  maven-cache:
  uploads_data: