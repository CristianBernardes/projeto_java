spring:
  application:
    name: projeto-java

  datasource:
    url: jdbc:postgresql://localhost:5433/java
    username: java
    password: java
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  rabbitmq:
    host: localhost
    port: 5672
    username: java
    password: java
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: projeto-java
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: br.com.projetojava.order.event

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.com.projetojava: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  jwt:
    secret: "minha-chave-secreta-de-pelo-menos-256-bits-para-hs256-segura"
    expiration-ms: 86400000
  upload:
    directory: .docker/uploads
    max-size-bytes: 10485760
    allowed-types:
      - image/jpeg
      - image/png
      - application/pdf
  messaging:
    outbox:
      poll-interval-ms: 2000
      batch-size: 50
    rabbitmq:
      order-exchange: order.exchange
      order-created-queue: order.created.queue
      order-created-routing-key: order.created
      order-dlx: order.dlx
      order-dlq: order.created.dlq
    kafka:
      order-events-topic: order-events
