spring:
  application:
    name: projeto-java

  datasource:
    url: jdbc:postgresql://localhost:5433/java
    username: java
    password: java
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.com.projetojava: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  jwt:
    secret: "minha-chave-secreta-de-pelo-menos-256-bits-para-hs256-segura"
    expiration-ms: 86400000
  upload:
    directory: .docker/uploads
    max-size-bytes: 10485760
    allowed-types:
      - image/jpeg
      - image/png
      - application/pdf
